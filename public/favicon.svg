<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#18181b"/>
  
  <!-- Electron orbits -->
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.9"/>
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.9" transform="rotate(60 32 32)"/>
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.9" transform="rotate(120 32 32)"/>
  
  <!-- Nucleus -->
  <circle cx="32" cy="32" r="6" fill="url(#grad2)"/>
  
  <!-- Electrons -->
  <circle cx="54" cy="32" r="3" fill="#c4b5fd"/>
  <circle cx="21" cy="13" r="3" fill="#c4b5fd"/>
  <circle cx="21" cy="51" r="3" fill="#c4b5fd"/>
</svg>